<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קפוץ את הסיפור! 🦘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            height: 100dvh; width: 100vw;
            overflow: hidden;
            user-select: none; -webkit-user-select: none;
            touch-action: manipulation;
        }

        .screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center;
            transition: opacity 0.35s ease;
        }
        .screen.hidden { opacity: 0; pointer-events: none; }

        /* ── CHOOSE ANIMAL ─────────────────────────────── */
        #screen-choose {
            background: linear-gradient(160deg, #fce4ec 0%, #e1bee7 50%, #bbdefb 100%);
            justify-content: center; gap: 22px; padding: 24px;
        }
        #screen-choose h1 {
            font-size: clamp(1.9em, 6vw, 2.8em);
            color: #6a1b9a; text-align: center;
            animation: pop-in 0.5s ease-out;
        }
        #screen-choose .sub {
            font-size: 1.2em; color: #7b1fa2; text-align: center;
        }
        .animal-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 14px; width: 100%; max-width: 340px;
        }
        .animal-btn {
            background: rgba(255,255,255,0.9);
            border: 3px solid #e1bee7; border-radius: 22px;
            padding: 18px 10px; cursor: pointer; text-align: center;
            transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.07);
        }
        .animal-btn:active { transform: scale(0.96); }
        .animal-btn:hover  { border-color: #ab47bc; box-shadow: 0 8px 22px rgba(171,71,188,0.22); transform: scale(1.05); }
        .animal-btn .ico { font-size: 54px; display: block; margin-bottom: 6px; }
        .animal-btn .nm  { font-size: 1.05em; color: #6a1b9a; font-weight: bold; }

        @keyframes pop-in {
            from { transform: scale(0.5); opacity: 0; }
            60%  { transform: scale(1.08); }
            to   { transform: scale(1);   opacity: 1; }
        }

        /* ── GAME SCREEN ───────────────────────────────── */
        #screen-game {
            background: linear-gradient(to bottom, #060012 0%, #120030 50%, #1e0048 100%);
            justify-content: flex-start;
        }

        /* Stars */
        .star {
            position: absolute; background: #fff; border-radius: 50%;
            pointer-events: none;
            animation: twinkle ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            from { opacity: 0.1; transform: scale(0.5); }
            to   { opacity: 1;   transform: scale(1.4); }
        }

        /* Story panel */
        #story-panel {
            position: relative; z-index: 10; width: 100%;
            padding: 8px 48px 8px 10px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            min-height: 58px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        #story-label {
            font-size: 0.68em; color: rgba(255,255,255,0.45); margin-bottom: 2px;
        }
        #story-text {
            font-size: clamp(0.9em, 3.8vw, 1.2em);
            color: #ffd700; text-align: center; direction: rtl;
            font-weight: bold; min-height: 1.4em;
        }
        #story-blanks {
            font-size: 0.75em; color: rgba(255,255,255,0.18);
            text-align: center;
        }

        /* Back button */
        .back-btn {
            position: absolute; top: 8px; right: 8px; z-index: 50;
            background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 50%; width: 38px; height: 38px;
            font-size: 17px; cursor: pointer; text-decoration: none; color: white;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }

        /* Progress dots */
        #prog-row {
            z-index: 10; display: flex; gap: 5px;
            padding: 5px 10px; justify-content: center; flex-wrap: wrap;
            flex-shrink: 0;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgba(255,255,255,0.15);
            transition: background 0.3s, transform 0.3s;
        }
        .dot.lit {
            background: #ffd700;
            box-shadow: 0 0 6px rgba(255,215,0,0.9);
            transform: scale(1.3);
        }

        /* Play area */
        #play-area {
            flex: 1; position: relative; width: 100%;
            overflow: hidden; cursor: pointer;
        }

        /* Animal — anchored by its BOTTOM edge: 52% from play-area bottom */
        #animal-wrap {
            position: absolute; left: 50%;
            /* bottom set by JS after layout */
            transform: translateX(-50%);
            z-index: 5; text-align: center;
            pointer-events: none;
        }
        #animal-char {
            font-size: clamp(56px, 13vw, 76px); display: block;
            filter: drop-shadow(0 6px 18px rgba(0,0,0,0.55));
            animation: bob 1.9s ease-in-out infinite;
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0)    rotate(-5deg); }
            50%       { transform: translateY(-16px) rotate(5deg); }
        }
        @keyframes do-jump {
            0%   { transform: translateY(0)     scale(1)    rotate(0deg);  }
            25%  { transform: translateY(-100px) scale(1.28) rotate(20deg); }
            55%  { transform: translateY(-75px)  scale(1.12) rotate(-12deg); }
            100% { transform: translateY(0)     scale(1)    rotate(0deg);  }
        }

        /* Platform — starts below screen, rises via JS */
        #platform {
            position: absolute; left: 3%; right: 3%;
            bottom: -200px;          /* hidden below screen initially */
            border-radius: 20px 20px 0 0;
            z-index: 3;
            background: linear-gradient(to top, rgba(100,20,150,0.97) 0%, rgba(180,90,210,0.9) 100%);
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 -10px 40px rgba(150,50,200,0.6),
                        inset 0 1px 0 rgba(255,255,255,0.2);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 14px 18px 18px;
            min-height: 90px;
        }
        #platform-label {
            font-size: 0.72em; color: rgba(255,255,255,0.6);
            margin-bottom: 6px;
        }
        #word-display {
            font-size: clamp(2.2em, 9vw, 3.2em);
            font-weight: 900; color: #fff;
            text-shadow: 0 0 25px rgba(255,255,255,0.7), 0 2px 8px rgba(0,0,0,0.6);
            direction: rtl; text-align: center; line-height: 1.25;
            letter-spacing: 0.04em;
        }

        /* Danger strip at bottom of play-area */
        #danger-strip {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 4px; z-index: 15;
            background: rgba(255,255,255,0.07);
        }
        #danger-fill {
            height: 100%; width: 0%;
            background: linear-gradient(to right, #4fc3f7 0%, #f06292 60%, #ef5350 100%);
        }

        /* Floating word when collected */
        .word-burst {
            position: fixed; font-weight: bold; color: #ffd700;
            font-size: 1.5em; pointer-events: none; z-index: 300;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            white-space: nowrap; direction: rtl;
            animation: burst-up 0.9s ease-out forwards;
        }
        @keyframes burst-up {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            40%  { opacity: 1; transform: translateY(-60px) scale(1.15); }
            100% { opacity: 0; transform: translateY(-140px) scale(0.5); }
        }

        /* Jump button */
        #jump-btn {
            flex-shrink: 0; z-index: 20;
            width: 86%; max-width: 320px;
            margin: 7px auto 9px;
            padding: 16px; border: none; border-radius: 38px;
            background: linear-gradient(135deg, #f48fb1 0%, #ce93d8 55%, #90caf9 100%);
            color: #fff; font-size: clamp(1.3em, 4.5vw, 1.65em); font-weight: bold;
            cursor: pointer;
            box-shadow: 0 7px 25px rgba(244,143,177,0.5);
            transition: transform 0.1s, box-shadow 0.08s;
            -webkit-tap-highlight-color: transparent;
        }
        #jump-btn:active { transform: scale(0.94); box-shadow: 0 3px 12px rgba(244,143,177,0.3); }

        /* ── STORY REVEAL ──────────────────────────────── */
        #screen-story {
            background: linear-gradient(160deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
            padding: 24px 18px; gap: 14px;
            overflow-y: auto; justify-content: flex-start;
        }
        #screen-story h2 {
            font-size: clamp(1.7em, 5.5vw, 2.3em);
            color: #6a1b9a; text-align: center;
            animation: pop-in 0.5s ease-out;
            margin-top: 10px;
        }
        #screen-story .sub { font-size: 1em; color: #7b1fa2; text-align: center; }
        #story-card {
            background: rgba(255,255,255,0.93);
            border-radius: 22px; padding: 20px 24px;
            width: 100%; max-width: 480px;
            box-shadow: 0 10px 38px rgba(0,0,0,0.1);
            border: 3px solid #e1bee7; direction: rtl;
        }
        .story-line {
            font-size: clamp(1.1em, 4vw, 1.4em);
            line-height: 2.1; color: #4a148c; text-align: right;
            opacity: 0; transform: translateX(20px);
            animation: slide-in 0.5s ease-out forwards;
        }
        @keyframes slide-in { to { opacity: 1; transform: translateX(0); } }
        #reveal-animal { font-size: 65px; text-align: center; }
        #again-btn {
            background: linear-gradient(135deg, #ab47bc, #7b1fa2);
            color: #fff; border: none;
            padding: 14px 44px; border-radius: 30px;
            font-size: 1.25em; font-weight: bold; cursor: pointer;
            box-shadow: 0 6px 18px rgba(123,31,162,0.3);
            transition: transform 0.15s;
            margin-bottom: 24px;
        }
        #again-btn:hover { transform: scale(1.05); }

        /* Confetti */
        #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }
    </style>
</head>
<body>

<canvas id="confetti"></canvas>

<!-- ══ SCREEN 1: CHOOSE ANIMAL ══════════════════════════ -->
<div id="screen-choose" class="screen">
    <h1>🦘 קפוץ את הסיפור!</h1>
    <p class="sub">בחרי את החיה שלך:</p>
    <div class="animal-grid">
        <div class="animal-btn" onclick="chooseAnimal('🐸','צְפַרְדֵּעַ')">
            <span class="ico">🐸</span><span class="nm">צְפַרְדֵּעַ</span>
        </div>
        <div class="animal-btn" onclick="chooseAnimal('🦋','פַּרְפַּר')">
            <span class="ico">🦋</span><span class="nm">פַּרְפַּר</span>
        </div>
        <div class="animal-btn" onclick="chooseAnimal('🐰','אַרְנָב')">
            <span class="ico">🐰</span><span class="nm">אַרְנָב</span>
        </div>
        <div class="animal-btn" onclick="chooseAnimal('🦄','חַד-קֶרֶן')">
            <span class="ico">🦄</span><span class="nm">חַד-קֶרֶן</span>
        </div>
    </div>
</div>

<!-- ══ SCREEN 2: GAME ══════════════════════════════════ -->
<div id="screen-game" class="screen hidden">

    <div id="story-panel">
        <a href="../index.html" class="back-btn" title="חזרה">🏠</a>
        <div id="story-label">📖 הסיפור מתגלה...</div>
        <div id="story-text"> </div>
    </div>

    <div id="prog-row"></div>

    <div id="play-area">
        <!-- stars injected by JS -->
        <div id="animal-wrap">
            <span id="animal-char">🐸</span>
        </div>
        <div id="platform">
            <div id="platform-label">קְרָאִי אֶת הַמִּלָּה 👇</div>
            <div id="word-display"></div>
        </div>
        <div id="danger-strip"><div id="danger-fill"></div></div>
    </div>

    <button id="jump-btn" onclick="doJump()">🦘 קָפוֹץ!</button>
</div>

<!-- ══ SCREEN 3: STORY REVEAL ══════════════════════════ -->
<div id="screen-story" class="screen hidden">
    <h2>🎉 כָּל הַכָּבוֹד לִירִי! 🎉</h2>
    <p class="sub">קָרָאתְ אֶת כָּל הַמִּלִּים וּבָנִיתְ סִיפּוּר!</p>
    <div id="story-card"></div>
    <div id="reveal-animal"></div>
    <button id="again-btn" onclick="restartGame()">🔄 שַׂחֲקִי שׁוּב!</button>
</div>

<script>
// ── DATA ────────────────────────────────────────────────
const CHUNKS = [
    "פַּעַם הָיְתָה",
    "נְסִיכָה קְטַנָּה",
    "בְּשֵׁם לִירִי",
    "הִיא אָהֲבָה לִקְרֹא",
    "יוֹם אֶחָד",
    "יָצָא מִן הַסֵּפֶר",
    "כּוֹכָב קָסוּם",
    "הוּא אָמַר לָהּ",
    "בּוֹאִי נָטוּס",
    "יַחַד אֶל הַיָּרֵחַ",
    "לִירִי חִיְּכָה",
    "וְטָסָה גָּבוֹהַּ גָּבוֹהַּ",
    "וְחָיוּ בְּשִׂמְחָה לָעַד ✨"
];

const STORY_LINES = [
    "פַּעַם הָיְתָה נְסִיכָה קְטַנָּה בְּשֵׁם לִירִי.",
    "הִיא אָהֲבָה לִקְרֹא.",
    "יוֹם אֶחָד יָצָא מִן הַסֵּפֶר כּוֹכָב קָסוּם.",
    'הוּא אָמַר לָהּ: "בּוֹאִי נָטוּס יַחַד אֶל הַיָּרֵחַ!"',
    "לִירִי חִיְּכָה וְטָסָה גָּבוֹהַּ גָּבוֹהַּ.",
    "וְחָיוּ בְּשִׂמְחָה לָעַד! 🌟"
];

// ── STATE ───────────────────────────────────────────────
let chosenAnimal = '🐸';
let idx = 0;
let jumping = false;
let active = false;
let rafId = null;
// These are measured once per presentChunk call:
let riseStart, riseFrom, riseTo, riseDuration;

// ── BUILD STARS ─────────────────────────────────────────
(function buildStars() {
    const area = document.getElementById('play-area');
    for (let i = 0; i < 70; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const sz = Math.random() * 3 + 1;
        s.style.cssText =
            `width:${sz}px;height:${sz}px;` +
            `left:${Math.random()*100}%;top:${Math.random()*100}%;` +
            `animation-duration:${(Math.random()*1.8+1.2).toFixed(2)}s;` +
            `animation-delay:${(Math.random()*2.5).toFixed(2)}s;`;
        area.appendChild(s);
    }
})();

// ── CHOOSE ANIMAL ───────────────────────────────────────
function chooseAnimal(emoji) {
    chosenAnimal = emoji;
    document.getElementById('animal-char').textContent = emoji;
    document.getElementById('reveal-animal').textContent = emoji;
    showScreen('screen-game');
    // Small delay so the screen is visible and laid out before we measure
    requestAnimationFrame(() => requestAnimationFrame(startGame));
}

// ── START GAME ──────────────────────────────────────────
function startGame() {
    idx = 0; jumping = false; active = true;

    // Position animal: bottom edge at 52% of play-area height
    const playArea = document.getElementById('play-area');
    const playH = playArea.offsetHeight;
    const animalWrap = document.getElementById('animal-wrap');
    const animalH = document.getElementById('animal-char').offsetHeight;
    const animalBottomEdgePx = playH * 0.52; // 52% from bottom
    // bottom CSS positions the element's bottom edge
    animalWrap.style.bottom = animalBottomEdgePx + 'px';
    animalWrap.style.left = '50%';
    animalWrap.style.transform = 'translateX(-50%)';

    // Build progress dots
    const row = document.getElementById('prog-row');
    row.innerHTML = '';
    CHUNKS.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'dot'; d.id = `d${i}`;
        row.appendChild(d);
    });

    updateStoryPanel();
    presentChunk();
}

// ── PRESENT CHUNK ───────────────────────────────────────
function presentChunk() {
    if (idx >= CHUNKS.length) { endGame(); return; }

    const chunk = CHUNKS[idx];
    document.getElementById('word-display').textContent = chunk;

    // Show the "read this" label only for the first word
    document.getElementById('platform-label').style.display = idx === 0 ? 'block' : 'none';

    // Measure layout
    const playArea  = document.getElementById('play-area');
    const platform  = document.getElementById('platform');
    const animalWrap = document.getElementById('animal-wrap');

    const playH         = playArea.offsetHeight;
    const platH         = platform.offsetHeight;
    const animalBottomPx = parseFloat(animalWrap.style.bottom); // 52% of playH

    // FIX: target = platform's bottom edge so that platform's TOP touches animal's BOTTOM
    // platform_top = bottom + height  →  we want  bottom + height = animalBottomPx
    // so: bottom = animalBottomPx - height
    const target = animalBottomPx - platH - 2; // -2px so it just kisses the animal's feet

    // Reset platform to off-screen below
    platform.style.transition = 'none';
    platform.style.bottom = '-200px';
    document.getElementById('danger-fill').style.width = '0%';

    // Speed: 3.8s for first chunk, down to 2.4s
    const dur = Math.max(2400, 3800 - idx * 110);

    riseFrom     = -200;
    riseTo       = target;
    riseDuration = dur;
    riseStart    = null; // will be set on first RAF

    // Kick off the rise on next paint
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(riseTick);
}

// ── RISE ANIMATION (RAF) ────────────────────────────────
function riseTick(now) {
    if (!active || jumping) return;
    if (!riseStart) riseStart = now;

    const elapsed  = now - riseStart;
    const progress = Math.min(elapsed / riseDuration, 1);
    const current  = riseFrom + (riseTo - riseFrom) * progress;

    document.getElementById('platform').style.bottom = current + 'px';
    document.getElementById('danger-fill').style.width = (progress * 100) + '%';

    if (progress < 1) {
        rafId = requestAnimationFrame(riseTick);
    } else {
        // Platform reached — auto-collect (be gentle for a 6-year-old)
        doJump();
    }
}

// ── JUMP ────────────────────────────────────────────────
function doJump() {
    if (jumping || !active) return;
    jumping = true;

    cancelAnimationFrame(rafId);

    // Collect this chunk
    document.getElementById(`d${idx}`).classList.add('lit');
    spawnWordBurst(CHUNKS[idx]);
    idx++;
    updateStoryPanel();

    // Slide platform back down quickly
    const platform = document.getElementById('platform');
    platform.style.transition = 'bottom 0.4s ease-in';
    platform.style.bottom = '-200px';
    setTimeout(() => { platform.style.transition = 'none'; }, 420);

    // Animal jump animation
    const char = document.getElementById('animal-char');
    char.style.animation = 'none';
    void char.offsetWidth; // force reflow
    char.style.animation = 'do-jump 0.6s cubic-bezier(0.15,0.88,0.45,1.1) forwards';

    setTimeout(() => {
        // Restore bob animation
        char.style.animation = 'none';
        void char.offsetWidth;
        char.style.animation = 'bob 1.9s ease-in-out infinite';
        jumping = false;

        if (idx < CHUNKS.length) {
            setTimeout(presentChunk, 300);
        } else {
            setTimeout(endGame, 400);
        }
    }, 650);
}

// ── STORY PANEL ─────────────────────────────────────────
function updateStoryPanel() {
    const collected = CHUNKS.slice(0, idx);
    const remaining = CHUNKS.length - idx;
    document.getElementById('story-text').textContent =
        collected.length ? collected.join(' ') : ' ';
    // Show dot hints for remaining
    document.getElementById('story-label').textContent =
        remaining > 0
            ? `📖 נשארו עוד ${remaining} מילות סיפור...`
            : '📖 הסיפור מוכן!';
}

// ── WORD BURST ANIMATION ─────────────────────────────────
function spawnWordBurst(text) {
    const plat = document.getElementById('platform');
    const r = plat.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'word-burst';
    el.textContent = '⭐ ' + text;
    el.style.left = Math.max(4, r.left + r.width / 2 - 90) + 'px';
    el.style.top  = (r.top + 10) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 950);
}

// ── END GAME ────────────────────────────────────────────
function endGame() {
    active = false;
    cancelAnimationFrame(rafId);
    showScreen('screen-story');
    buildStoryReveal();
    launchConfetti();
}

function buildStoryReveal() {
    const card = document.getElementById('story-card');
    card.innerHTML = '';
    STORY_LINES.forEach((line, i) => {
        const p = document.createElement('p');
        p.className = 'story-line';
        p.textContent = line;
        p.style.animationDelay = (i * 0.38) + 's';
        card.appendChild(p);
    });
}

// ── CONFETTI ─────────────────────────────────────────────
const cvs = document.getElementById('confetti');
const ctx = cvs.getContext('2d');
let pieces = [], confGoing = false;

function resizeCvs() { cvs.width = innerWidth; cvs.height = innerHeight; }
window.addEventListener('resize', resizeCvs);
resizeCvs();

function launchConfetti() {
    const cols = ['#f48fb1','#ce93d8','#90caf9','#a5d6a7','#fff59d','#ffcc02','#80deea'];
    pieces = Array.from({length: 130}, () => ({
        x: Math.random() * cvs.width,
        y: -10 - Math.random() * 250,
        w: Math.random() * 11 + 5,
        h: Math.random() * 6 + 3,
        c: cols[Math.floor(Math.random() * cols.length)],
        vx: (Math.random() - 0.5) * 6,
        vy: Math.random() * 5 + 2,
        r: Math.random() * 360,
        rv: (Math.random() - 0.5) * 11,
        a: 1
    }));
    if (!confGoing) { confGoing = true; confFrame(); }
}
function confFrame() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    pieces.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.12;
        p.r += p.rv; p.a -= 0.006;
        if (p.a > 0) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.r * Math.PI / 180);
            ctx.globalAlpha = p.a;
            ctx.fillStyle = p.c;
            ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
            ctx.restore();
        }
    });
    pieces = pieces.filter(p => p.a > 0);
    if (pieces.length) requestAnimationFrame(confFrame);
    else { confGoing = false; ctx.clearRect(0, 0, cvs.width, cvs.height); }
}

// ── HELPERS ──────────────────────────────────────────────
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}
function restartGame() { showScreen('screen-choose'); }

// Tap anywhere in play-area = jump
document.getElementById('play-area').addEventListener('click', doJump);

// Keyboard support
document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); doJump(); }
});
</script>
